name: update flake.lock

# Daily: move the pinned inputs forward on their release branches (where security fixes
# land), prove the result still evaluates, lints and resolves, then push it to main.
# A failure means the update needs a look, and nothing is pushed. mac-update applies it.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Follow Homebrew's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/Homebrew/brew/releases/latest --jq .tag_name)
          sed -i '' -E "s|github:Homebrew/brew/[^\"]+|github:Homebrew/brew/$tag|" flake.nix
      - run: nix flake update
      - run: nix flake check --print-build-logs
      # A full build, not a dry run: nix-homebrew patches Homebrew, and a new Homebrew
      # release can break those patches.
      - run: nix build .#darwinConfigurations.mac.system --print-build-logs
      - name: Push if anything changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update flake.lock and Homebrew"
          git push
